<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>现代排班管理系统 - 手机适配版</title>
    <!-- 引入字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --color-day: #f59e0b;    /* 白班 */
            --color-eve: #3b82f6;    /* 前夜 */
            --color-night: #8b5cf6;  /* 后夜 */
            --color-rest: #10b981;   /* 休息 */
            --holiday-color: #ef4444; /* 节日颜色 */
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            -webkit-tap-highlight-color: transparent; /* 清除移动端点击高亮 */
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex; justify-content: center; align-items: center;
            padding: 10px;
        }

        .calendar-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            width: 100%; max-width: 500px;
            border-radius: 20px; /* [修改] 略微减小圆角 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
            margin-top: 10px;
        }

        .calendar-header {
            background: #fff; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .current-month { font-size: 1.1rem; font-weight: 600; color: #1f2937; cursor: pointer; }
        .current-month:hover { color: var(--primary); }

        .nav-btn { background: #f3f4f6; border: none;
            width: 36px; height: 36px; border-radius: 10px;
            cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
        }
        /* 主页图标样式 */
        .nav-btn-home { 
            margin-right: 10px; 
            background: var(--primary); 
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .nav-btn-home svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .calendar-grid {
            padding: 8px; display: grid;
            grid-template-columns: repeat(7, 1fr); gap: 4px; /* [修改] 减小间隙防止挤压 */
        }

        .weekday {
            text-align: center; font-size: 0.75rem;
            font-weight: 600; color: #9ca3af; padding-bottom: 8px;
        }

        .day-cell {
            min-height: 55px; /* [修改] 使用最小高度而非固定比例，防止文字重叠 */
            background: #fff;
            border-radius: 10px; padding: 2px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; border: 1px solid #f3f4f6;
            cursor: pointer; position: relative;
        }

        /* [新增] 移动端小屏幕适配 */
        @media screen and (max-width: 400px) {
            .day-cell { min-height: 50px; }
            .day-number { font-size: 0.85rem !important; }
            .lunar-text { font-size: 0.55rem !important; transform: scale(0.9); }
            .shift-badge { font-size: 0.5rem !important; padding: 1px 0 !important; }
        }

        .holiday-badge {
            position: absolute; top: 1px; right: 1px;
            font-size: 8px; color: #fff; background: #ef4444;
            padding: 0px 2px; border-radius: 2px; font-weight: bold;
            z-index: 2;
        }

        .date-info { 
            display: flex; flex-direction: column; align-items: center; 
            margin-top: 2px; margin-bottom: 4px; 
        }
        .day-number { font-size: 0.9rem; font-weight: 600; color: #374151; }
        .lunar-text { font-size: 0.6rem; color: #9ca3af; line-height: 1; }
        .holiday-text { color: var(--holiday-color); font-weight: 600; }
        .solar-term-text { color: #8b5cf6; font-weight: 600; }

        .shift-badge {
            width: 90%; font-size: 0.6rem; padding: 2px 0;
            border-radius: 4px; color: white; text-align: center; font-weight: 600;
            margin-bottom: 2px;
        }

        .shift-白班 { background: var(--color-day); }
        .shift-前夜 { background: var(--color-eve); }
        .shift-后夜 { background: var(--color-night); }
        .shift-小休 { background: var(--color-rest); }
        .shift-大休 { background: var(--color-rest); }

        .today-marker { border: 1.5px solid var(--primary) !important; background: #f5f7ff; }

        .legend {
            padding: 10px; background: #f9fafb;
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; /* [修改] 移动端改为两列显示 */
        }

        .legend-item { display: flex; align-items: center; font-size: 0.7rem; color: #6b7280; }
        .dot { width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }

        /* 模态框适配 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; /* [修改] absolute改为fixed确保手机滚动时不位移 */
            background: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(4px);
        }

        .modal-content { 
            background: white; padding: 20px; border-radius: 20px; width: 90%; 
            max-height: 90vh; overflow-y: auto; /* [新增] 防止手机屏幕矮导致内容溢出 */
        }
        .modal-section { margin-bottom: 15px; }
        .modal-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; border-left: 4px solid var(--primary); padding-left: 8px; }

        .shift-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .option-btn { padding: 12px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; cursor: pointer; font-size: 0.8rem; }

        .config-area { display: flex; flex-direction: column; gap: 10px; }
        .sequence-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 0.85rem; }
        .btn-group { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .btn-save { background: var(--primary); color: white; }
        .btn-reset { background: #f3f4f6; color: #374151; }

        .year-picker, .month-picker, .picker-months {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .picker-months {
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px 0;
        }
        .picker-item {
            padding: 10px;
            text-align: center;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .picker-item:hover { background: #f3f4f6; }
        .picker-item.selected { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
    <!-- 引入农历计算库（本地） -->
    <script src="js/lunar.min.js"></script>
</head>
<body>

    <div class="calendar-card">
        <header class="calendar-header">
            <!-- 主页按钮 -->
            <button class="nav-btn-home" onclick="goBack()" title="主页">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </button>
            <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
            <div id="currentMonth" class="current-month" onclick="openMonthPicker()">2026年 02月</div>
            <button class="nav-btn" onclick="changeMonth(1)">›</button>
        </header>

        <div class="calendar-grid" id="calendarGrid">
            <div class="weekday">日</div><div class="weekday">一</div><div class="weekday">二</div>
            <div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div>
            <div class="weekday">六</div>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="dot" style="background:var(--color-day)"></span>白班</div>
            <div class="legend-item"><span class="dot" style="background:var(--color-eve)"></span>前夜</div>
            <div class="legend-item"><span class="dot" style="background:var(--color-night)"></span>后夜</div>
            <div class="legend-item"><span class="dot" style="background:var(--color-rest)"></span>小休/大休</div>
        </div>

        <div id="monthPickerOverlay" class="modal-overlay" onclick="closeMonthPicker()">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div class="modal-section">
                    <div class="calendar-header" style="padding: 10px 0;">
                        <button class="nav-btn" onclick="pickerChangeYear(-1)">‹</button>
                        <div id="pickerYearMonth" class="current-month">2026年</div>
                        <button class="nav-btn" onclick="pickerChangeYear(1)">›</button>
                    </div>
                    <div class="picker-months" id="pickerMonths"></div>
                </div>
            </div>
        </div>

        <div id="modalOverlay" class="modal-overlay" onclick="closeModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div class="modal-section">
                    <div id="modalTitle" class="modal-title">快速设为序列中的：</div>
                    <div class="shift-options">
                        <button class="option-btn" onclick="setNewShift(0)">1.白班</button>
                        <button class="option-btn" onclick="setNewShift(1)">2.前夜</button>
                        <button class="option-btn" onclick="setNewShift(2)">3.小休</button>
                        <button class="option-btn" onclick="setNewShift(3)">4.后夜</button>
                        <button class="option-btn" onclick="setNewShift(4)">5.大休</button>
                    </div>
                </div>

                <div class="modal-section">
                    <div class="modal-title">修改默认倒班序列</div>
                    <div class="config-area">
                        <input type="text" id="sequenceInput" class="sequence-input" value="白班,前夜,小休,后夜,大休">
                        <div class="btn-group">
                            <button class="action-btn btn-save" onclick="saveSequence()">应用新规则</button>
                            <button class="action-btn btn-reset" onclick="resetSystem()">重置系统</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * [代码功能注释]
         * 1. 排班算法：基于基准日期（currentRefDate）计算任意日期与基准日的天数差，
         * 通过天数差对序列长度取模，得到对应班次。
         * 2. 农历转换：利用 Intl.DateTimeFormat API 获取阴历月份和日期。
         * 3. 移动端适配：CSS 部分使用了 Flex 布局和媒体查询解决重叠。
         */

        let SHIFT_SEQUENCE = ['白班', '前夜', '小休', '后夜', '大休'];
        
        // 基准点：2026-02-27 是休息 (序列索引 2)
        let currentRefDate = new Date(2026, 1, 27); 
        let currentRefIndex = 2; 

        let viewDate = new Date(); 
        let selectedDateForEdit = null;
        
        const holidayCache = {};
        
        async function fetchHolidaysForYear(year) {
            if (holidayCache[year]) return holidayCache[year];
            try {
                const response = await fetch(`https://timor.tech/api/holiday/year/${year}`);
                const data = await response.json();
                if (data.code === 0 && data.holiday) {
                    const holidays = {};
                    for (const [dateKey, holidayInfo] of Object.entries(data.holiday)) {
                        if (holidayInfo.holiday) {
                            holidays[dateKey] = holidayInfo.name;
                        }
                    }
                    holidayCache[year] = holidays;
                    return holidays;
                }
            } catch (e) {
                console.error('获取节假日数据失败:', e);
            }
            return {};
        }

        const SOLAR_TERMS_NAMES = [
            "小寒", "大寒", "立春", "雨水", "惊蛰", "春分",
            "清明", "谷雨", "立夏", "小满", "芒种", "夏至",
            "小暑", "大暑", "立秋", "处暑", "白露", "秋分",
            "寒露", "霜降", "立冬", "小雪", "大雪", "冬至"
        ];

        function getSolarTermsForYear(year) {
            const y = parseInt(("" + year).substr(2, 2));
            const result = {};
            const terms = [
                { name: "小寒", m: 1, c: 5.4055 },
                { name: "大寒", m: 1, c: 20.12 },
                { name: "立春", m: 2, c: 3.87 },
                { name: "雨水", m: 2, c: 18.73 },
                { name: "惊蛰", m: 3, c: 5.63 },
                { name: "春分", m: 3, c: 20.646 },
                { name: "清明", m: 4, c: 4.81 },
                { name: "谷雨", m: 4, c: 20.1 },
                { name: "立夏", m: 5, c: 5.52 },
                { name: "小满", m: 5, c: 21.04 },
                { name: "芒种", m: 6, c: 5.678 },
                { name: "夏至", m: 6, c: 21.37 },
                { name: "小暑", m: 7, c: 7.108 },
                { name: "大暑", m: 7, c: 22.83 },
                { name: "立秋", m: 8, c: 7.5 },
                { name: "处暑", m: 8, c: 23.13 },
                { name: "白露", m: 9, c: 7.646 },
                { name: "秋分", m: 9, c: 23.042 },
                { name: "寒露", m: 10, c: 8.318 },
                { name: "霜降", m: 10, c: 23.438 },
                { name: "立冬", m: 11, c: 7.438 },
                { name: "小雪", m: 11, c: 22.36 },
                { name: "大雪", m: 12, c: 7.18 },
                { name: "冬至", m: 12, c: 21.94 }
            ];
            for (let i = 0; i < terms.length; i++) {
                const t = terms[i];
                const day = Math.floor(y * 0.2422 + t.c) - Math.floor(y / 4);
                result[`${t.m}-${day}`] = t.name;
            }
            return result;
        }

        let currentYearSolarTerms = {};
        let currentYearHolidays = {};

        // 农历日期字符：一到十，用于组成初二、初三...初十
        const LUNAR_CHARS = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
        // 农历月份名称：正月代表一月，冬月是十一月，腊月是十二月
        const LUNAR_MONTHS = ["正月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "冬月", "腊月"];

        /**
         * 获取日期的农历信息
         * @param {Date} date - 要查询的日期对象
         * @returns {Object} - 包含 label(显示文字), isHoliday(是否节日), showBadge(是否显示休字标签) 
         * 
         * 显示规则：
         * - 农历每月初一：显示当前农历月份（如正月、二月...腊月）
         * - 农历其他日期：显示日期序数（如初二、初三...三十）
         * - 公历节日：显示节日名称并显示"休"标签
         * - 二十四节气：显示节气名称
         */
        function getChineseDateInfo(date) {
            // 获取公历的月和日，用于查询公历节日
            const m = date.getMonth() + 1;
            const d = date.getDate();
            // 构造公历节日查询键，如 "02-17" 表示2月17日（API返回格式带前导零）
            const key = `${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            
            // 使用 lunar-javascript 库获取准确的农历信息
            // Solar.fromYmd(year, month, day) 创建公历日期
            // getLunar() 获取对应的农历日期
            const solar = Solar.fromYmd(date.getFullYear(), m, d);
            const lunar = solar.getLunar();
            
            // 农历月份（1-12，1=正月，11=冬月，12=腊月，13=闰正月...）
            const lunarMonth = lunar.getMonth();
            // 农历日期（1-30）
            const lunarDay = lunar.getDay();
            
            // 处理闰月：如果月份大于12，表示闰月
            // 闰月返回格式如 13表示闰正月，14表示闰二月等
            
            // 1. 先检查公历节日（优先级最高）
            // 根据年份选择对应的节日数据
            const holidays = currentYearHolidays;
            if (holidays[key]) return { label: holidays[key], isHoliday: true, showBadge: true };
            
            // 2. 检查二十四节气
            if (currentYearSolarTerms[key]) return { label: currentYearSolarTerms[key], isSolarTerm: true };
            
            // 3. 判断是否是农历每月初一（农历月的第一天）
            // 如果日期为1，表示是农历每月第一天
            if (lunarDay === 1 && lunarMonth >= 1 && lunarMonth <= 12) {
                // 根据农历月份数字（1-12）返回对应的农历月份名称
                return { label: LUNAR_MONTHS[lunarMonth - 1], isHoliday: false };
            }
            
            // 4. 处理农历其他日期（初二到三十）
            let n = lunarDay;
            let label = "";
            // 初一~初十：初+一二三四五六七八九十
            if (n < 11) label = "初" + LUNAR_CHARS[n-1];
            // 初十
            else if (n === 10) label = "初十";
            // 十一~十九：十+一二三四五六七八九
            else if (n < 20) label = "十" + LUNAR_CHARS[n-11];
            // 二十
            else if (n === 20) label = "二十";
            // 廿一~廿九：廿+一二三四五六七八九
            else if (n < 30) label = "廿" + LUNAR_CHARS[n-21];
            // 三十
            else if (n === 30) label = "三十";
            return { label: label, isHoliday: false };
        }

        function updateCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthDisplay = document.getElementById('currentMonth');
            const headerCount = 7;
            while (grid.children.length > headerCount) grid.removeChild(grid.lastChild);

            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            monthDisplay.innerText = `${year}年 ${String(month + 1).padStart(2, '0')}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            today.setHours(0,0,0,0);

            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

            for (let day = 1; day <= daysInMonth; day++) {
                const currentDate = new Date(year, month, day);
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.onclick = () => openModal(currentDate);

                if (currentDate.getTime() === today.getTime()) cell.classList.add('today-marker');

                const diffDays = Math.round((currentDate.getTime() - currentRefDate.getTime()) / 86400000);
                const seqLen = SHIFT_SEQUENCE.length;
                const shiftIndex = ((currentRefIndex + diffDays) % seqLen + seqLen) % seqLen;
                const shiftName = SHIFT_SEQUENCE[shiftIndex];

                const info = getChineseDateInfo(currentDate);
                let badgeHtml = info.showBadge ? `<div class="holiday-badge">休</div>` : '';
                let lunarClass = '';
                if (info.isHoliday) lunarClass = 'holiday-text';
                else if (info.isSolarTerm) lunarClass = 'solar-term-text';

                // [修改] 优化内部 HTML 结构，适应手机显示宽度
                cell.innerHTML = `
                    ${badgeHtml}
                    <div class="date-info">
                        <span class="day-number">${day}</span>
                        <span class="lunar-text ${lunarClass}">${info.label}</span>
                    </div>
                    <span class="shift-badge shift-${shiftName.includes('小休') || shiftName.includes('大休') ? '小休' : shiftName}">${shiftName}</span>
                `;
                grid.appendChild(cell);
            }
        }

        function openModal(date) {
            selectedDateForEdit = new Date(date);
            document.getElementById('modalTitle').innerText = `${date.getMonth()+1}月${date.getDate()}日 快捷修改：`;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        function setNewShift(index) {
            currentRefDate = new Date(selectedDateForEdit);
            currentRefIndex = index;
            updateCalendar();
            closeModal();
        }

        function saveSequence() {
            const input = document.getElementById('sequenceInput').value;
            if (!input) return;
            SHIFT_SEQUENCE = input.split(',').map(s => s.trim()).filter(s => s !== "");
            updateCalendar();
            closeModal();
        }

        function resetSystem() {
            SHIFT_SEQUENCE = ['白班', '前夜', '小休', '后夜', '大休'];
            document.getElementById('sequenceInput').value = "白班,前夜,小休,后夜,大休";
            currentRefDate = new Date(2026, 1, 27);
            currentRefIndex = 2;
            updateCalendar();
            closeModal();
        }

        function changeMonth(offset) {
            viewDate.setMonth(viewDate.getMonth() + offset);
            const newYear = viewDate.getFullYear();
            currentYearSolarTerms = getSolarTermsForYear(newYear);
            loadYearHolidays(newYear).then(() => updateCalendar());
        }
        
        async function loadYearHolidays(year) {
            if (!holidayCache[year]) {
                const holidays = await fetchHolidaysForYear(year);
                if (year === viewDate.getFullYear()) {
                    currentYearHolidays = holidays;
                }
            } else {
                if (year === viewDate.getFullYear()) {
                    currentYearHolidays = holidayCache[year];
                }
            }
        }

        function openMonthPicker() {
            renderPickerMonths();
            document.getElementById('monthPickerOverlay').style.display = 'flex';
        }

        function pickerChangeYear(offset) {
            viewDate.setFullYear(viewDate.getFullYear() + offset);
            const newYear = viewDate.getFullYear();
            loadYearHolidays(newYear);
            renderPickerMonths();
        }

        function renderPickerMonths() {
            const pickerYearMonth = document.getElementById('pickerYearMonth');
            const pickerMonths = document.getElementById('pickerMonths');
            const currentYear = viewDate.getFullYear();
            const currentMonth = viewDate.getMonth() + 1;
            
            pickerYearMonth.innerText = `${currentYear}年`;
            
            let monthsHtml = '';
            for (let m = 1; m <= 12; m++) {
                monthsHtml += `<div class="picker-item ${m === currentMonth ? 'selected' : ''}" onclick="selectMonth(${m})">${m}月</div>`;
            }
            pickerMonths.innerHTML = monthsHtml;
        }

        function selectMonth(month) {
            viewDate.setMonth(month - 1);
            const newYear = viewDate.getFullYear();
            currentYearSolarTerms = getSolarTermsForYear(newYear);
            loadYearHolidays(newYear).then(() => {
                updateCalendar();
                closeMonthPicker();
            });
        }

        function closeMonthPicker() {
            document.getElementById('monthPickerOverlay').style.display = 'none';
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        window.onload = function() {
            const currentYear = new Date().getFullYear();
            currentYearSolarTerms = getSolarTermsForYear(currentYear);
            loadYearHolidays(currentYear).then(() => updateCalendar());
        };
    </script>
</body>
</html>
