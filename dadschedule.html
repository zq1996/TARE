<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>排班</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --color-ban1: #f59e0b;
            --color-ban2: #3b82f6;
            --color-rest: #10b981;
            --holiday-color: #ef4444;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex; justify-content: center; align-items: center;
            padding: 10px;
        }

        .calendar-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            width: 100%; max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
            margin-top: 10px;
        }

        .calendar-header {
            background: #fff; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .current-month { font-size: 1.1rem; font-weight: 600; color: #1f2937; }

        .nav-btn { background: #f3f4f6; border: none;
            width: 36px; height: 36px; border-radius: 10px;
            cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-btn-home { 
            margin-right: 10px; 
            background: var(--primary); 
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .nav-btn-home svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .calendar-grid {
            padding: 8px; display: grid;
            grid-template-columns: repeat(7, 1fr); gap: 4px;
        }

        .weekday {
            text-align: center; font-size: 0.75rem;
            font-weight: 600; color: #9ca3af; padding-bottom: 8px;
        }

        .day-cell {
            min-height: 55px;
            background: #fff;
            border-radius: 10px; padding: 2px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; border: 1px solid #f3f4f6;
            position: relative;
        }

        @media screen and (max-width: 400px) {
            .day-cell { min-height: 50px; }
            .day-number { font-size: 0.85rem !important; }
            .lunar-text { font-size: 0.55rem !important; transform: scale(0.9); }
            .shift-badge { font-size: 0.5rem !important; padding: 1px 0 !important; }
        }

        .holiday-badge {
            position: absolute; top: 1px; right: 1px;
            font-size: 8px; color: #fff; background: #ef4444;
            padding: 0px 2px; border-radius: 2px; font-weight: bold;
            z-index: 2;
        }

        .date-info { 
            display: flex; flex-direction: column; align-items: center; 
            margin-top: 2px; margin-bottom: 4px; 
        }
        .day-number { font-size: 0.9rem; font-weight: 600; color: #374151; }
        .lunar-text { font-size: 0.6rem; color: #9ca3af; line-height: 1; }
        .holiday-text { color: var(--holiday-color); font-weight: 600; }
        .solar-term-text { color: #8b5cf6; font-weight: 600; }

        .shift-badge {
            width: 90%; font-size: 0.6rem; padding: 2px 0;
            border-radius: 4px; color: white; text-align: center; font-weight: 600;
            margin-bottom: 2px;
        }

        .shift-班1 { background: var(--color-ban1); }
        .shift-班2 { background: var(--color-ban2); }
        .shift-休息 { background: var(--color-rest); }

        .today-marker { border: 1.5px solid var(--primary) !important; background: #f5f7ff; }

        .legend {
            padding: 10px; background: #f9fafb;
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 10px;
        }

        .legend-item { display: flex; align-items: center; font-size: 0.7rem; color: #6b7280; }
        .dot { width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.min.js"></script>
</head>
<body>

    <div class="calendar-card">
        <header class="calendar-header">
            <button class="nav-btn-home" onclick="goToToday()" title="回到今天">
                <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
            <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
            <div id="currentMonth" class="current-month">2026年 03月</div>
            <button class="nav-btn" onclick="changeMonth(1)">›</button>
        </header>

        <div class="calendar-grid" id="calendarGrid">
            <div class="weekday">日</div><div class="weekday">一</div><div class="weekday">二</div>
            <div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div>
            <div class="weekday">六</div>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="dot" style="background:var(--color-ban1)"></span>班1</div>
            <div class="legend-item"><span class="dot" style="background:var(--color-ban2)"></span>班2</div>
            <div class="legend-item"><span class="dot" style="background:var(--color-rest)"></span>休息</div>
        </div>
    </div>

    <script>
        const SHIFT_SEQUENCE = ['班1', '班2', '休息'];
        
        let currentRefDate = new Date(2026, 2, 15);
        let currentRefIndex = 0;

        let viewDate = new Date();
        
        const holidayCache = {};
        
        async function fetchHolidaysForYear(year) {
            if (holidayCache[year]) return holidayCache[year];
            try {
                const response = await fetch(`https://timor.tech/api/holiday/year/${year}`);
                const data = await response.json();
                if (data.code === 0 && data.holiday) {
                    const holidays = {};
                    for (const [dateKey, holidayInfo] of Object.entries(data.holiday)) {
                        if (holidayInfo.holiday) {
                            holidays[dateKey] = holidayInfo.name;
                        }
                    }
                    holidayCache[year] = holidays;
                    return holidays;
                }
            } catch (e) {
                console.error('获取节假日数据失败:', e);
            }
            return {};
        }

        const SOLAR_TERMS_NAMES = [
            "小寒", "大寒", "立春", "雨水", "惊蛰", "春分",
            "清明", "谷雨", "立夏", "小满", "芒种", "夏至",
            "小暑", "大暑", "立秋", "处暑", "白露", "秋分",
            "寒露", "霜降", "立冬", "小雪", "大雪", "冬至"
        ];

        function getSolarTermsForYear(year) {
            const y = parseInt(("" + year).substr(2, 2));
            const result = {};
            const terms = [
                { name: "小寒", m: 1, c: 5.4055 },
                { name: "大寒", m: 1, c: 20.12 },
                { name: "立春", m: 2, c: 3.87 },
                { name: "雨水", m: 2, c: 18.73 },
                { name: "惊蛰", m: 3, c: 5.63 },
                { name: "春分", m: 3, c: 20.646 },
                { name: "清明", m: 4, c: 4.81 },
                { name: "谷雨", m: 4, c: 20.1 },
                { name: "立夏", m: 5, c: 5.52 },
                { name: "小满", m: 5, c: 21.04 },
                { name: "芒种", m: 6, c: 5.678 },
                { name: "夏至", m: 6, c: 21.37 },
                { name: "小暑", m: 7, c: 7.108 },
                { name: "大暑", m: 7, c: 22.83 },
                { name: "立秋", m: 8, c: 7.5 },
                { name: "处暑", m: 8, c: 23.13 },
                { name: "白露", m: 9, c: 7.646 },
                { name: "秋分", m: 9, c: 23.042 },
                { name: "寒露", m: 10, c: 8.318 },
                { name: "霜降", m: 10, c: 23.438 },
                { name: "立冬", m: 11, c: 7.438 },
                { name: "小雪", m: 11, c: 22.36 },
                { name: "大雪", m: 12, c: 7.18 },
                { name: "冬至", m: 12, c: 21.94 }
            ];
            for (let i = 0; i < terms.length; i++) {
                const t = terms[i];
                const day = Math.floor(y * 0.2422 + t.c) - Math.floor(y / 4);
                result[`${String(t.m).padStart(2, '0')}-${String(day).padStart(2, '0')}`] = t.name;
            }
            return result;
        }

        let currentYearSolarTerms = {};
        let currentYearHolidays = {};

        const LUNAR_CHARS = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
        const LUNAR_MONTHS = ["正月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "冬月", "腊月"];

        const LUNAR_LEGAL_HOLIDAYS = {
            "1-1": "春节",
            "5-5": "端午节",
            "8-15": "中秋节"
        };

        const LUNAR_FESTIVALS = {
            "1-15": "元宵节",
            "2-2": "龙抬头",
            "7-7": "七夕节",
            "7-15": "中元节",
            "9-9": "重阳节",
            "12-8": "腊八节",
            "12-23": "小年"
        };

        const SOLAR_HOLIDAYS = {
            "01-01": "元旦",
            "05-01": "劳动节",
            "10-01": "国庆节"
        };

        function getChineseDateInfo(date) {
            const m = date.getMonth() + 1;
            const d = date.getDate();
            const key = `${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            
            const solar = Solar.fromYmd(date.getFullYear(), m, d);
            const lunar = solar.getLunar();
            
            const lunarMonth = lunar.getMonth();
            const lunarDay = lunar.getDay();
            
            if (SOLAR_HOLIDAYS[key]) return { label: SOLAR_HOLIDAYS[key], isHoliday: true, showBadge: true };
            const holidays = currentYearHolidays;
            if (holidays[key]) return { label: holidays[key], isHoliday: true, showBadge: true };
            
            if (currentYearSolarTerms[key]) {
                const termName = currentYearSolarTerms[key];
                if (termName === "清明") {
                    return { label: termName, isSolarTerm: true, isHoliday: true, showBadge: true };
                }
                return { label: termName, isSolarTerm: true };
            }
            
            const lunarYear = lunar.getYear();
            const nextDaySolar = Solar.fromYmd(date.getFullYear(), m, d).next(1);
            const nextDayLunar = nextDaySolar.getLunar();
            if (nextDayLunar.getMonth() === 1 && nextDayLunar.getDay() === 1) {
                return { label: "除夕", isHoliday: true, showBadge: true };
            }
            
            const lunarFestivalKey = `${lunarMonth}-${lunarDay}`;
            if (LUNAR_LEGAL_HOLIDAYS[lunarFestivalKey]) {
                return { label: LUNAR_LEGAL_HOLIDAYS[lunarFestivalKey], isHoliday: true, showBadge: true };
            }
            
            if (LUNAR_FESTIVALS[lunarFestivalKey]) {
                return { label: LUNAR_FESTIVALS[lunarFestivalKey], isHoliday: false };
            }
            
            if (lunarDay === 1 && lunarMonth >= 1 && lunarMonth <= 12) {
                return { label: LUNAR_MONTHS[lunarMonth - 1], isHoliday: false };
            }
            
            let n = lunarDay;
            let label = "";
            if (n < 11) label = "初" + LUNAR_CHARS[n-1];
            else if (n === 10) label = "初十";
            else if (n < 20) label = "十" + LUNAR_CHARS[n-11];
            else if (n === 20) label = "二十";
            else if (n < 30) label = "廿" + LUNAR_CHARS[n-21];
            else if (n === 30) label = "三十";
            return { label: label, isHoliday: false };
        }

        function updateCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthDisplay = document.getElementById('currentMonth');
            const headerCount = 7;
            while (grid.children.length > headerCount) grid.removeChild(grid.lastChild);

            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            monthDisplay.innerText = `${year}年 ${String(month + 1).padStart(2, '0')}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            today.setHours(0,0,0,0);

            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

            for (let day = 1; day <= daysInMonth; day++) {
                const currentDate = new Date(year, month, day);
                const cell = document.createElement('div');
                cell.className = 'day-cell';

                if (currentDate.getTime() === today.getTime()) cell.classList.add('today-marker');

                const diffDays = Math.round((currentDate.getTime() - currentRefDate.getTime()) / 86400000);
                const seqLen = SHIFT_SEQUENCE.length;
                const shiftIndex = ((currentRefIndex + diffDays) % seqLen + seqLen) % seqLen;
                const shiftName = SHIFT_SEQUENCE[shiftIndex];

                const info = getChineseDateInfo(currentDate);
                let badgeHtml = info.showBadge ? `<div class="holiday-badge">休</div>` : '';
                let lunarClass = '';
                if (info.isHoliday) lunarClass = 'holiday-text';
                else if (info.isSolarTerm) lunarClass = 'solar-term-text';

                cell.innerHTML = `
                    ${badgeHtml}
                    <div class="date-info">
                        <span class="day-number">${day}</span>
                        <span class="lunar-text ${lunarClass}">${info.label}</span>
                    </div>
                    <span class="shift-badge shift-${shiftName}">${shiftName}</span>
                `;
                grid.appendChild(cell);
            }
        }

        function changeMonth(offset) {
            viewDate.setMonth(viewDate.getMonth() + offset);
            const newYear = viewDate.getFullYear();
            currentYearSolarTerms = getSolarTermsForYear(newYear);
            loadYearHolidays(newYear).then(() => updateCalendar());
        }
        
        async function loadYearHolidays(year) {
            if (!holidayCache[year]) {
                const holidays = await fetchHolidaysForYear(year);
                if (year === viewDate.getFullYear()) {
                    currentYearHolidays = holidays;
                }
            } else {
                if (year === viewDate.getFullYear()) {
                    currentYearHolidays = holidayCache[year];
                }
            }
        }

        function goToToday() {
            viewDate = new Date();
            const currentYear = viewDate.getFullYear();
            currentYearSolarTerms = getSolarTermsForYear(currentYear);
            loadYearHolidays(currentYear).then(() => updateCalendar());
        }

        window.onload = function() {
            const currentYear = new Date().getFullYear();
            currentYearSolarTerms = getSolarTermsForYear(currentYear);
            loadYearHolidays(currentYear).then(() => updateCalendar());
        };
    </script>
</body>
</html>
