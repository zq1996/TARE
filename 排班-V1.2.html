<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>现代排班管理系统 - 手机适配版</title>
    <!-- 引入字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --color-day: #f59e0b;    /* 白班 */
            --color-eve: #3b82f6;    /* 前夜 */
            --color-night: #8b5cf6;  /* 后夜 */
            --color-rest: #10b981;   /* 休息 */
            --holiday-color: #ef4444; /* 节日颜色 */
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            -webkit-tap-highlight-color: transparent; /* 清除移动端点击高亮 */
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex; justify-content: center; align-items: flex-start; /* [修改] 移动端顶部对齐防止遮挡 */
            padding: 10px;
        }

        .calendar-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            width: 100%; max-width: 500px;
            border-radius: 20px; /* [修改] 略微减小圆角 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
            margin-top: 10px;
        }

        .calendar-header {
            background: #fff; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .current-month { font-size: 1.1rem; font-weight: 600; color: #1f2937; }

        .nav-btn {
            background: #f3f4f6; border: none;
            width: 36px; height: 36px; border-radius: 10px;
            cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
        }

        .calendar-grid {
            padding: 8px; display: grid;
            grid-template-columns: repeat(7, 1fr); gap: 4px; /* [修改] 减小间隙防止挤压 */
        }

        .weekday {
            text-align: center; font-size: 0.75rem;
            font-weight: 600; color: #9ca3af; padding-bottom: 8px;
        }

        .day-cell {
            min-height: 55px; /* [修改] 使用最小高度而非固定比例，防止文字重叠 */
            background: #fff;
            border-radius: 10px; padding: 2px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; border: 1px solid #f3f4f6;
            cursor: pointer; position: relative;
        }

        /* [新增] 移动端小屏幕适配 */
        @media screen and (max-width: 400px) {
            .day-cell { min-height: 50px; }
            .day-number { font-size: 0.85rem !important; }
            .lunar-text { font-size: 0.55rem !important; transform: scale(0.9); }
            .shift-badge { font-size: 0.5rem !important; padding: 1px 0 !important; }
        }

        .holiday-badge {
            position: absolute; top: 1px; right: 1px;
            font-size: 8px; color: #fff; background: #ef4444;
            padding: 0px 2px; border-radius: 2px; font-weight: bold;
            z-index: 2;
        }

        .date-info { 
            display: flex; flex-direction: column; align-items: center; 
            margin-top: 2px; margin-bottom: 4px; 
        }
        .day-number { font-size: 0.9rem; font-weight: 600; color: #374151; }
        .lunar-text { font-size: 0.6rem; color: #9ca3af; line-height: 1; }
        .holiday-text { color: var(--holiday-color); font-weight: 600; }

        .shift-badge {
            width: 90%; font-size: 0.6rem; padding: 2px 0;
            border-radius: 4px; color: white; text-align: center; font-weight: 600;
            margin-bottom: 2px;
        }

        .shift-白班 { background: var(--color-day); }
        .shift-前夜 { background: var(--color-eve); }
        .shift-后夜 { background: var(--color-night); }
        .shift-休息 { background: var(--color-rest); }

        .today-marker { border: 1.5px solid var(--primary) !important; background: #f5f7ff; }

        .legend {
            padding: 10px; background: #f9fafb;
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; /* [修改] 移动端改为两列显示 */
        }

        .legend-item { display: flex; align-items: center; font-size: 0.7rem; color: #6b7280; }
        .dot { width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }

        /* 模态框适配 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; /* [修改] absolute改为fixed确保手机滚动时不位移 */
            background: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(4px);
        }

        .modal-content { 
            background: white; padding: 20px; border-radius: 20px; width: 90%; 
            max-height: 90vh; overflow-y: auto; /* [新增] 防止手机屏幕矮导致内容溢出 */
        }
        .modal-section { margin-bottom: 15px; }
        .modal-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; border-left: 4px solid var(--primary); padding-left: 8px; }

        .shift-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .option-btn { padding: 12px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; cursor: pointer; font-size: 0.8rem; }

        .config-area { display: flex; flex-direction: column; gap: 10px; }
        .sequence-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 0.85rem; }
        .btn-group { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .btn-save { background: var(--primary); color: white; }
        .btn-reset { background: #f3f4f6; color: #374151; }
    </style>
</head>
<body>

    <div class="calendar-card">
        <header class="calendar-header">
            <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
            <div id="currentMonth" class="current-month">2026年 02月</div>
            <button class="nav-btn" onclick="changeMonth(1)">›</button>
        </header>

        <div class="calendar-grid" id="calendarGrid">
            <div class="weekday">日</div><div class="weekday">一</div><div class="weekday">二</div>
            <div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div>
            <div class="weekday">六</div>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="dot" style="background:var(--color-day)"></span>白(8-16)</div>
            <div class="legend-item"><span class="dot" style="background:var(--color-eve)"></span>前(16-24)</div>
            <div class="legend-item"><span class="dot" style="background:var(--color-night)"></span>后(0-8)</div>
            <div class="legend-item"><span class="dot" style="background:var(--color-rest)"></span>休息</div>
        </div>

        <div id="modalOverlay" class="modal-overlay" onclick="closeModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div class="modal-section">
                    <div id="modalTitle" class="modal-title">快速设为序列中的：</div>
                    <div class="shift-options">
                        <button class="option-btn" onclick="setNewShift(0)">1.白班</button>
                        <button class="option-btn" onclick="setNewShift(1)">2.前夜</button>
                        <button class="option-btn" onclick="setNewShift(2)">3.休息</button>
                        <button class="option-btn" onclick="setNewShift(3)">4.后夜</button>
                        <button class="option-btn" onclick="setNewShift(4)">5.休息</button>
                    </div>
                </div>

                <div class="modal-section">
                    <div class="modal-title">修改默认倒班序列</div>
                    <div class="config-area">
                        <input type="text" id="sequenceInput" class="sequence-input" value="白班,前夜,休息,后夜,休息">
                        <div class="btn-group">
                            <button class="action-btn btn-save" onclick="saveSequence()">应用新规则</button>
                            <button class="action-btn btn-reset" onclick="resetSystem()">重置系统</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * [代码功能注释]
         * 1. 排班算法：基于基准日期（currentRefDate）计算任意日期与基准日的天数差，
         * 通过天数差对序列长度取模，得到对应班次。
         * 2. 农历转换：利用 Intl.DateTimeFormat API 获取阴历月份和日期。
         * 3. 移动端适配：CSS 部分使用了 Flex 布局和媒体查询解决重叠。
         */

        let SHIFT_SEQUENCE = ['白班', '前夜', '休息', '后夜', '休息'];
        
        // 基准点：2026-02-27 是休息 (序列索引 2)
        let currentRefDate = new Date(2026, 1, 27); 
        let currentRefIndex = 2; 

        let viewDate = new Date(); 
        let selectedDateForEdit = null;

        const HOLIDAYS_2026 = {
            "1-1": "元旦", "2-17": "春节", "2-18": "春节", "2-19": "春节", "2-20": "春节", "2-21": "春节", "2-22": "春节", "2-23": "春节", "2-24": "春节",
            "4-5": "清明", "5-1": "劳动节", "5-2": "休息", "5-3": "休息", "5-4": "休息", "5-5": "休息", "6-19": "端午", "9-25": "中秋",
            "10-1": "国庆", "10-2": "国庆", "10-3": "国庆", "10-4": "国庆", "10-5": "国庆", "10-6": "国庆", "10-7": "国庆"
        };

        const LUNAR_CHARS = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];

        function getChineseDateInfo(date) {
            const m = date.getMonth() + 1;
            const d = date.getDate();
            const key = `${m}-${d}`;
            const formatter = new Intl.DateTimeFormat('zh-u-ca-chinese', { day: 'numeric', month: 'long' });
            let lunarString = formatter.format(date).replace(/.*年/, '').trim();
            
            if (HOLIDAYS_2026[key]) return { label: HOLIDAYS_2026[key], isHoliday: true, showBadge: true };
            if (lunarString.includes('初一')) return { label: lunarString.replace('初一', ''), isHoliday: false };
            
            let dayNumMatch = lunarString.match(/\d+/);
            if (dayNumMatch) {
                let n = parseInt(dayNumMatch[0]);
                let label = "";
                if (n < 11) label = "初" + LUNAR_CHARS[n-1];
                else if (n === 10) label = "初十";
                else if (n < 20) label = "十" + LUNAR_CHARS[n-11];
                else if (n === 20) label = "二十";
                else if (n < 30) label = "廿" + LUNAR_CHARS[n-21];
                else if (n === 30) label = "三十";
                return { label: label, isHoliday: false };
            }
            return { label: lunarString, isHoliday: false };
        }

        function updateCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthDisplay = document.getElementById('currentMonth');
            const headerCount = 7;
            while (grid.children.length > headerCount) grid.removeChild(grid.lastChild);

            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            monthDisplay.innerText = `${year}年 ${String(month + 1).padStart(2, '0')}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            today.setHours(0,0,0,0);

            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

            for (let day = 1; day <= daysInMonth; day++) {
                const currentDate = new Date(year, month, day);
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.onclick = () => openModal(currentDate);

                if (currentDate.getTime() === today.getTime()) cell.classList.add('today-marker');

                const diffDays = Math.round((currentDate.getTime() - currentRefDate.getTime()) / 86400000);
                const seqLen = SHIFT_SEQUENCE.length;
                const shiftIndex = ((currentRefIndex + diffDays) % seqLen + seqLen) % seqLen;
                const shiftName = SHIFT_SEQUENCE[shiftIndex];

                const info = getChineseDateInfo(currentDate);
                let badgeHtml = info.showBadge ? `<div class="holiday-badge">休</div>` : '';

                // [修改] 优化内部 HTML 结构，适应手机显示宽度
                cell.innerHTML = `
                    ${badgeHtml}
                    <div class="date-info">
                        <span class="day-number">${day}</span>
                        <span class="lunar-text ${info.isHoliday ? 'holiday-text' : ''}">${info.label}</span>
                    </div>
                    <span class="shift-badge shift-${shiftName.includes('休息') ? '休息' : shiftName}">${shiftName}</span>
                `;
                grid.appendChild(cell);
            }
        }

        function openModal(date) {
            selectedDateForEdit = new Date(date);
            document.getElementById('modalTitle').innerText = `${date.getMonth()+1}月${date.getDate()}日 快捷修改：`;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        function setNewShift(index) {
            currentRefDate = new Date(selectedDateForEdit);
            currentRefIndex = index;
            updateCalendar();
            closeModal();
        }

        function saveSequence() {
            const input = document.getElementById('sequenceInput').value;
            if (!input) return;
            SHIFT_SEQUENCE = input.split(',').map(s => s.trim()).filter(s => s !== "");
            updateCalendar();
            closeModal();
        }

        function resetSystem() {
            SHIFT_SEQUENCE = ['白班', '前夜', '休息', '后夜', '休息'];
            document.getElementById('sequenceInput').value = "白班,前夜,休息,后夜,休息";
            currentRefDate = new Date(2026, 1, 27);
            currentRefIndex = 2;
            updateCalendar();
            closeModal();
        }

        function changeMonth(offset) {
            viewDate.setMonth(viewDate.getMonth() + offset);
            updateCalendar();
        }

        window.onload = updateCalendar;
    </script>
</body>
</html>
